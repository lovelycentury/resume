name: deploy
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

# Repository secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, DEPLOY_PATH.
# The VPS must be logged in to ghcr.io (or the packages made public) so that
# `docker compose pull` can fetch both images.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: be/Dockerfile
          target: runtime
          push: true
          tags: ghcr.io/lovelycentury/resume/be:latest

      # Split origins, so the API base URL is compiled into the bundle here and
      # has to match the resume-api host in ~/vps-infra/Caddyfile.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: fe/Dockerfile
          target: runtime
          push: true
          build-args: |
            VITE_API_BASE_URL=https://resume-api.okryshto.dev
          tags: ghcr.io/lovelycentury/resume/fe:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "ops/docker-compose.yml"
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 1 # drop the ops/ prefix
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose pull
            docker compose up -d --remove-orphans
